name: Build LSPosed Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Restore templates
        run: |
          mkdir -p template/assets
          base64 -d manifest.b64 > template/AndroidManifest.xml
          base64 -d arsc.b64 > template/resources.arsc
          printf 'com.eta.dseek.MainHook' > template/assets/xposed_init

      - name: Xposed API
        run: curl -L -o api82.jar https://api.xposed.info/framework/api-82.jar

      - name: Compile
        run: |
          mkdir -p bc
          javac -source 8 -target 8 -nowarn -cp api82.jar -d bc src/com/eta/dseek/MainHook.java
          mkdir -p bd
          d8 --min-api 24 --output bd bc/com/eta/dseek/*.class
          dexdump -f bd/classes.dex | grep -c "Class descriptor" || true

      - name: Check
        run: |
          if dexdump -f bd/classes.dex | grep "Class descriptor" | grep -q "de/robv/android/xposed"; then
            echo BAD_DEX; exit 1
          fi

      - name: Package
        run: |
          mkdir -p ap
          cp -r template/. ap/
          cp bd/classes.dex ap/
          cd ap && zip -qr ../u.apk .

      - name: Sign
        run: |
          keytool -genkeypair -keystore r.jks -alias e -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass etadseek -keypass etadseek \
            -dname "CN=EtaDSU,C=CN"
          zipalign -p 4 u.apk a.apk
          apksigner sign --ks r.jks --ks-pass pass:etadseek --key-pass pass:etadseek --out EtaDSU.apk a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: EtaDSU.apk
