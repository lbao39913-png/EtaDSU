name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build-tools
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d sdk
          mkdir -p sdk/cmdline-tools
          mv sdk/cmdline-tools sdk/tmp && mkdir -p sdk/cmdline-tools && mv sdk/tmp sdk/cmdline-tools/latest
          yes | sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          sdk/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "/tmp/sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Templates
        run: |
          mkdir -p template/assets
          base64 -d manifest.b64 > template/AndroidManifest.xml
          base64 -d arsc.b64 > template/resources.arsc
          printf 'com.eta.dseek.MainHook' > template/assets/xposed_init

      - name: Compile
        run: |
          AJ=/tmp/sdk/platforms/android-34/android.jar
          mkdir -p bc bd
          javac -source 8 -target 8 -nowarn -cp "$AJ" -d bc src/com/eta/dseek/MainHook.java
          d8 --min-api 24 --lib "$AJ" --output bd bc/com/eta/dseek/*.class
          dexdump -f bd/classes.dex | grep "Class descriptor"

      - name: Package and sign
        run: |
          mkdir -p ap
          cp -r template/. ap/
          cp bd/classes.dex ap/
          cd ap && zip -qr ../u.apk .
          cd ..
          keytool -genkeypair -keystore r.jks -alias e -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass etadseek -keypass etadseek -dname "CN=EtaDSU,C=CN"
          zipalign -p 4 u.apk a.apk
          apksigner sign --ks r.jks --ks-pass pass:etadseek --key-pass pass:etadseek --out EtaDSU.apk a.apk
          ls -l EtaDSU.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f EtaDSU.apk
          git commit -m "build: apk $(date +%s)" || true
          git push origin main || true
