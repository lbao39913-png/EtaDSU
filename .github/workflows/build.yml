name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build-tools
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d sdk
          mkdir -p sdk/cmdline-tools
          mv sdk/cmdline-tools sdk/tmp && mkdir -p sdk/cmdline-tools && mv sdk/tmp sdk/cmdline-tools/latest
          yes | sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          sdk/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" >/dev/null
          echo "/tmp/sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Get tools and templates
        run: |
          M=https://repo1.maven.org/maven2
          wget -q -O /tmp/smali.jar    $M/org/smali/smali/2.5.2/smali-2.5.2.jar
          wget -q -O /tmp/dexlib2.jar  $M/org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar
          wget -q -O /tmp/guava.jar    $M/com/google/guava/guava/31.1-jre/guava-31.1-jre.jar
          wget -q -O /tmp/jcmd.jar     $M/com/beust/jcommander/1.78/jcommander-1.78.jar
          wget -q -O /tmp/antlr.jar    $M/org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2.jar
          wget -q -O /tmp/kotlin.jar   $M/org/jetbrains/kotlin/kotlin-stdlib/1.6.10/kotlin-stdlib-1.6.10.jar
          mkdir -p template/assets
          base64 -d manifest.b64 > template/AndroidManifest.xml
          base64 -d arsc.b64 > template/resources.arsc
          printf 'com.eta.dseek.MainHook' > template/assets/xposed_init
          ls -l /tmp/*.jar

      - name: Prepare smali tree
        run: |
          mkdir -p sm/com/eta/dseek
          cp MainHook.smali sm/com/eta/dseek/MainHook.smali
          find sm -type f

      - name: Compile smali
        run: |
          CP=/tmp/smali.jar:/tmp/dexlib2.jar:/tmp/guava.jar:/tmp/jcmd.jar:/tmp/antlr.jar:/tmp/kotlin.jar
          java -cp "$CP" org.jf.smali.Main -o classes.dex sm 2>&1 | head -40
          ls -l classes.dex
          dexdump -f classes.dex | grep "Class descriptor"

      - name: Verify
        run: |
          dexdump -f classes.dex | grep "Class descriptor" | grep -q "com/eta/dseek/MainHook" || { echo "no MainHook"; exit 1; }
          if dexdump -f classes.dex | grep "Class descriptor" | grep -q "de/robv/android/xposed"; then
            echo "BAD: xposed api in dex"; exit 1
          fi
          echo OK

      - name: Package and sign
        run: |
          mkdir -p ap
          cp -r template/. ap/
          cp classes.dex ap/
          cd ap && zip -qr ../u.apk .
          cd ..
          keytool -genkeypair -keystore r.jks -alias e -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass etadseek -keypass etadseek -dname "CN=EtaDSU,C=CN"
          zipalign -p 4 u.apk a.apk
          apksigner sign --ks r.jks --ks-pass pass:etadseek --key-pass pass:etadseek --out EtaDSU.apk a.apk
          ls -l EtaDSU.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: EtaDSU.apk
