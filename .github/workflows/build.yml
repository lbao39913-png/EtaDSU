name: Build LSPosed Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d android-sdk
          mkdir -p android-sdk/latest
          mv android-sdk/cmdline-tools/* android-sdk/latest/ 2>/dev/null || true
          mkdir -p android-sdk/cmdline-tools
          mv android-sdk/latest android-sdk/cmdline-tools/latest
          yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          android-sdk/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" >/dev/null
          echo "$PWD/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Restore templates
        run: |
          mkdir -p template/assets
          base64 -d manifest.b64 > template/AndroidManifest.xml
          base64 -d arsc.b64 > template/resources.arsc
          printf 'com.eta.dseek.MainHook' > template/assets/xposed_init
          ls -l template template/assets

      - name: Xposed API
        run: wget -q -O api82.jar https://api.xposed.info/framework/api-82.jar

      - name: Compile
        run: |
          mkdir -p bc bd
          javac -source 8 -target 8 -nowarn -cp api82.jar -d bc src/com/eta/dseek/MainHook.java
          d8 --min-api 24 --output bd bc/com/eta/dseek/*.class
          echo "--- class count ---"
          dexdump -f bd/classes.dex | grep -c "Class descriptor" || true

      - name: Check dex
        run: |
          if dexdump -f bd/classes.dex | grep "Class descriptor" | grep -q "de/robv/android/xposed"; then
            echo "ERROR: Xposed API compiled into dex"
            exit 1
          fi
          echo "OK clean"

      - name: Package
        run: |
          mkdir -p ap
          cp -r template/. ap/
          cp bd/classes.dex ap/
          cd ap && zip -qr ../u.apk .

      - name: Sign
        run: |
          keytool -genkeypair -keystore r.jks -alias e -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass etadseek -keypass etadseek \
            -dname "CN=EtaDSU,C=CN"
          zipalign -p 4 u.apk a.apk
          apksigner sign --ks r.jks --ks-pass pass:etadseek --key-pass pass:etadseek --out EtaDSU.apk a.apk
          ls -l EtaDSU.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: EtaDSU.apk
